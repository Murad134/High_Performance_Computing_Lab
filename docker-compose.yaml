services:
  frontend:
    build:
      context: ./frontend/Research_lab
      dockerfile: Dockerfile
    image: hpc-frontend:v1
    container_name: hpc-frontend-v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/Research_lab:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - hpc-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hpc-backend:v1
    container_name: hpc-backend-v1
    ports:
      - "2500:2500"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/uploads:/app/uploads
    env_file:
      - ./backend/.env
    networks:
      - hpc-network

volumes:
  frontend_node_modules:
  backend_node_modules:

networks:
  hpc-network:
    driver: bridge